<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ApiVibe JSON Schema</title>
    <style>
      body {
        font-family: sans-serif;
        box-sizing: border-box;
        margin: 0;
        padding: 2rem 0;
        background: #18181b;
        color: #e4e4e7;
        display: flex;
        justify-content: center;
      }
      .container {
        width: 100%;
        max-width: 800px;
      }
      .search {
        margin-bottom: 1rem;
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
        border-radius: 0.5rem;
        border: 1px solid #3f3f46;
        background: #27272a;
        color: #e4e4e7;
      }
      .search:focus {
        outline: none;
        border-color: #3f3f46;
        box-shadow: 0 0 0 2px #3f3f46;
      }
      .search::placeholder {
        color: #a1a1aa;
      }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }
      .card {
        background: #27272a;
        border: 1px solid #3f3f46;
        padding: 1rem;
        border-radius: 0.5rem;
        text-align: center;
        cursor: pointer;
        transition: box-shadow 0.2s, background 0.2s;
      }
      .card:hover {
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        background: #3f3f46ae;
      }
      .error {
        text-align: center;
        margin-top: 2rem;
        font-size: 1.2rem;
        color: #f87171;
        cursor: pointer;
      }
      .loading {
        text-align: center;
        font-size: 1.2rem;
        color: #d0a741;
        display: none;
      }
      .loading::before {
        content: "⏳ ";
      }
    </style>
  </head>
  <body>
    <div class="container">
      <input type="text" id="search" class="search" placeholder="Search" />

      <div class="grid" id="cards"></div>
      <div id="loading-state" class="loading">Loading...</div>
    </div>

    <script>
      const username = "tenelabs";
      const repo = "apivibe-json-schema";

      const cardsContainer = document.getElementById("cards");
      const searchInput = document.getElementById("search");
      const loadingState = document.getElementById("loading-state");
      let allSchemas = [];

      async function fetchSchemas() {
        try {
          loadingState.style.display = "block";
          searchInput.placeholder = "Fetching schemas...";
          const response = await fetch(
            `https://api.github.com/repos/${username}/${repo}/contents/`
          );
          const files = await response.json();

          allSchemas = files
            .filter((file) => file.name.endsWith(".schema.json"))
            .map((file) => file.name);

          renderCards();
        } catch (error) {
          console.error("Failed to load schemas", error);
          cardsContainer.className = "error";
          searchInput.disabled = true;
          searchInput.style.cursor = "not-allowed";
          cardsContainer.innerHTML =
            "<p id='error-message'>Failed to load schemas. Click to retry.</p>";

          const errorMessage = document.getElementById("error-message");

          errorMessage.onclick = () => {
            location.reload();
          };
        } finally {
          loadingState.style.display = "none";
          searchInput.placeholder =
            allSchemas.length === 0
              ? "Something went wrong. Reload the site."
              : `Search ${allSchemas.length} schemas...`;
        }
      }

      function capitalizeFirstLetter(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
      }

      function renderCards(filter = "") {
        cardsContainer.className = "grid";
        cardsContainer.innerHTML = "";

        allSchemas
          .filter((name) => name.toLowerCase().includes(filter.toLowerCase()))
          .forEach((file) => {
            let displayName = file.replace(".schema.json", "");
            displayName = capitalizeFirstLetter(displayName);

            const card = document.createElement("div");
            card.className = "card";
            card.textContent = displayName;
            card.onclick = () => {
              window.location.href = `/${file}`;
            };

            cardsContainer.appendChild(card);
          });
      }

      searchInput.addEventListener("input", (e) => {
        renderCards(e.target.value);
      });

      fetchSchemas();
    </script>
  </body>
</html>
